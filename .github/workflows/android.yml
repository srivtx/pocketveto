name: Android APK

# Builds the PocketVeto Android app: web export (NEXT_STATIC=1) bundled
# into the native shell, assembled, signed with the sideload key, and
# attached to a GitHub Release. Sideload distribution — no Play Store.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install (frozen lockfile)
        run: bun install --frozen-lockfile

      - name: Build web export (static)
        run: bun run build:static

      - name: Bundle web export into the APK assets
        run: |
          # Bundles at the ASSETS ROOT (references are root-absolute) and
          # renames _next → pvpkg: aapt2 silently drops asset directories
          # starting with "_" (default ignore pattern <dir>_*), which is
          # how v1.4.1/v1.4.2 shipped an APK whose JS chunks never made it
          # in — the blank screen. The script also rewrites every _next/
          # reference and hard-fails if any survive.
          bun scripts/prepare-android-assets.mjs out android/app/src/main/assets

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Assemble release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Verify APK signing/cert metadata
        run: |
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          if [ -z "${APKSIGNER}" ]; then
            echo "apksigner not found in \$ANDROID_HOME/build-tools"
            exit 1
          fi
          "${APKSIGNER}" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk \
             PocketVeto-${GITHUB_REF_NAME:-manual}-android.apk
          # Stable filename, same bytes — lets the website link
          # releases/latest/download/PocketVeto-android.apk forever.
          cp android/app/build/outputs/apk/release/app-release.apk \
             PocketVeto-android.apk
          sha256sum PocketVeto-android.apk > PocketVeto-android.apk.sha256

      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PocketVeto-*-android.apk
            PocketVeto-android.apk
            PocketVeto-android.apk.sha256
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Upload artifact (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pocketveto-android-apk
          path: |
            PocketVeto-android.apk
            PocketVeto-android.apk.sha256
